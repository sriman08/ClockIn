name: Build ClockIn APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename Debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ClockIn.apk

      - name: Build Unsigned Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload ClockIn.apk
        uses: actions/upload-artifact@v4
        with:
          name: ClockIn-APK
          path: app/build/outputs/apk/debug/ClockIn.apk

      - name: Upload Release APK (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: ClockIn-Release-Unsigned-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
